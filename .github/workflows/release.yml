name: Release

# 合并到 main 后：
# - 有未消费的 changeset → 开/更新一个「Version Packages」PR（改版本号 + CHANGELOG）
# - 合并该 PR 后 → 发布到 npm（带 provenance）并打 tag `@kangyishuai/dsh-<name>@<version>`
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  actions: write # 给 Version Packages PR 补跑 CI（workflow_dispatch）
  id-token: write # npm provenance（scripts/publish.mjs 用 npm publish --provenance）

jobs:
  release:
    if: github.repository == 'kangyishuai/dsh-plugins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Version Packages PR 是 github-actions[bot] 用 GITHUB_TOKEN 创建的：GitHub 会抑制
      # GITHUB_TOKEN 产生的 pull_request 事件，所以这个 PR 上**永远不会**出现 CI 结果
      # （run 会以 failure/0 job 的形态存在，或干脆没有）。而 main 的规则集要求 CI 绿，
      # 于是这里显式 dispatch 一次，让检查结果落到该 PR 的 head commit 上。
      # 没有 release PR 时（本次是发布而非开 PR）直接跳过。
      - name: Run CI on the Version Packages PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number=$(gh pr list --head changeset-release/main --state open --json number --jq 'length')
          if [ "${number:-0}" = "0" ]; then
            echo "没有打开的 Version Packages PR，跳过"
            exit 0
          fi
          echo "给 changeset-release/main 补跑 CI（检查名会挂到 PR head commit 上）"
          gh workflow run ci.yml --ref changeset-release/main
