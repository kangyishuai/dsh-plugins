name: Plugin index

# 每次有插件发版（changesets 创建 GitHub Release）之后，重建「插件索引源」并发布成
# 一个只含 JSON 的 npm 数据包，Discover 里加这个地址的人和 `plugin_market` 工具就能
# 看到新版本：
#
#   https://cdn.jsdelivr.net/npm/@kangyishuai/dsh-plugin-index/index.json
#
# 为什么不在仓库里存 index.json：format 1 是写死的版本清单，宿主的 Discover 只信
# 索引里列出的版本。版本列表必须跟着 npm 现实走，所以每次发版从 registry 现场枚举，
# 而不是人工维护一份会过期的文件（见 docs/adr/0015-plugin-index-source.md）。
#
# 为什么发 npm 而不是 GitHub Pages / raw.githubusercontent：宿主拒绝跟随重定向、只给
# 一次读取 15 秒预算；jsDelivr 的 npm 入口两者都满足，而且在国内可达性明显更好。
# 实测结论记在 docs/runtime/0.2.2-rc.3.md。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

# 一次发版会创建多个 Release（每个包一个），这些运行内容相同：先到的那次发布，
# 后面的比对内容相同直接跳过，所以串行排队而不是互相取消。
concurrency:
  group: plugin-index
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kangyishuai/dsh-plugins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Build the index from the npm registry
        run: node scripts/build-index.mjs --out dist/index.json

      # 幂等：与 npm 上已发布的版本逐字节比较。一次发版会触发多次本工作流，
      # 只有内容真的变了才发新版本；手动重跑同理。
      - name: Compare with the published index
        id: diff
        run: |
          set -euo pipefail
          # 幂等比较要拉「最新已发布索引」的 tarball。npm 刚发布的版本在几十秒内可能
          # 还 404（tarball 传播滞后）：2026-11-20 两次 run（44708185706 / 44709195691）
          # 就是死在这里的裸 curl 上，所以先确认包存在，再对 tarball 拉取做退避重试。
          version=""
          if ! version=$(npm view @kangyishuai/dsh-plugin-index version 2>/dev/null); then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "还没有发布过索引包"
            exit 0
          fi
          fetched=""
          for attempt in $(seq 1 12); do
            tarball=$(npm view "@kangyishuai/dsh-plugin-index@${version}" dist.tarball 2>/dev/null || true)
            if [ -n "${tarball}" ] && curl -fsSL "${tarball}" -o /tmp/published.tgz; then
              fetched="yes"
              break
            fi
            echo "索引 tarball 还不可取（第 ${attempt}/12 次，10s 后重试）"
            sleep 10
          done
          if [ -z "${fetched}" ]; then
            echo "::error::npm registry 在 2 分钟内没有提供索引 ${version} 的 tarball"
            exit 1
          fi
          tar -xzOf /tmp/published.tgz package/index.json > /tmp/published.json
          if cmp -s /tmp/published.json dist/index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "索引没有变化，跳过发布"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the index package
        if: steps.diff.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          pkg=/tmp/dsh-plugin-index
          mkdir -p "${pkg}"
          cp dist/index.json "${pkg}/index.json"
          # 版本号只用来让 npm 接受发布；内容由 index.json 决定，不需要人工管理。
          cat > "${pkg}/package.json" <<EOF
          {
            "name": "@kangyishuai/dsh-plugin-index",
            "version": "0.0.${GITHUB_RUN_ID}",
            "description": "DSH plugin market index (format 1) for the @kangyishuai/dsh-* plugins: one JSON file, no code.",
            "license": "MIT",
            "repository": { "type": "git", "url": "git+https://github.com/kangyishuai/dsh-plugins.git" },
            "homepage": "https://github.com/kangyishuai/dsh-plugins#readme",
            "files": ["index.json"]
          }
          EOF
          npm publish "${pkg}" --provenance --access public

      # npm 刚发完会先"处理"一会儿（日志里就写着 may take a few minutes），registry
      # 可能还 404。先等 registry 真正提供这个版本，再做后面的 CDN 验收——否则第一次
      # 发版（2026-11-15 02:56 UTC）就是在这里被 CDN 的 404 判了失败。
      - name: Wait for the npm registry to serve the version
        if: steps.diff.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="0.0.${GITHUB_RUN_ID}"
          # 首次发布实测用了 5 分 21 秒才在 registry 可见（2026-11-15 02:56:40 →
          # 03:02:01 UTC），所以预算给 15 分钟，别贴着边界。
          for attempt in $(seq 1 90); do
            if npm view "@kangyishuai/dsh-plugin-index@${version}" version >/dev/null 2>&1; then
              echo "registry 已提供 ${version}（第 ${attempt} 次查询，间隔 10s）"
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm registry 在 15 分钟内没有提供 ${version}，请检查发布日志"
          exit 1

      # 权威核对：registry 上那个版本的 tarball 里的 index.json 必须与本次构建一致。
      - name: Compare the published tarball with the build
        if: steps.diff.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="0.0.${GITHUB_RUN_ID}"
          # 上一步「Wait for the npm registry to serve the version」只保证元数据可见，
          # tarball 本体可能还要再晚一拍（2026-11-20 09:12 UTC 实测：npm view 已可查，
          # curl tarball 仍 404）。这里退避重试，别把传播延迟判成发布错误。
          #
          # 2026-11-22 又把这条撞了一次：固定 12×10s（2 分钟）用完时 tarball 还没出来，
          # 而**索引本身其实已经正确发布**（事后核对 index.json 里版本齐全）——
          # 也就是"发布成功、校验误判"。改成指数退避 + 10 分钟预算，并把已等时长打进日志。
          fetched=""
          start=$(date +%s)
          deadline=$((start + 600))
          delay=10
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            tarball=$(npm view "@kangyishuai/dsh-plugin-index@${version}" dist.tarball 2>/dev/null || true)
            if [ -n "${tarball}" ] && curl -fsSL "${tarball}" -o /tmp/published-new.tgz; then
              fetched="yes"
              echo "tarball 已可取（第 ${attempt} 次尝试，已等 $(( $(date +%s) - start ))s）"
              break
            fi
            now=$(date +%s)
            if [ $((now + delay)) -gt "${deadline}" ]; then
              echo "::error::npm registry 在 $((now - start))s 内没有提供 ${version} 的 tarball"
              exit 1
            fi
            echo "新发布 tarball 还不可取（第 ${attempt} 次，已等 $((now - start))s，${delay}s 后重试）"
            sleep "${delay}"
            delay=$((delay * 2))
            if [ "${delay}" -gt 60 ]; then delay=60; fi
          done
          if [ -z "${fetched}" ]; then
            echo "::error::npm registry 没有提供 ${version} 的 tarball"
            exit 1
          fi
          tar -xzOf /tmp/published-new.tgz package/index.json > /tmp/published-new.json
          cmp /tmp/published-new.json dist/index.json
          echo "registry 上的 index.json 与本次构建逐字节一致"

      # jsDelivr 对未固定版本的路径有 12 小时边缘缓存；发版后主动失效，
      # 否则用户最多要等半天才看到新版本。
      - name: Purge the jsDelivr cache
        if: steps.diff.outputs.changed == 'true'
        run: curl -fsS "https://purge.jsdelivr.net/npm/@kangyishuai/dsh-plugin-index/index.json"

      # 验收：从 CDN 取一次，用仓库自己的校验器确认它是合法索引。
      # CDN 索引新包可能滞后几分钟，所以重试；重试完仍没有只告警不失败——
      # npm 上已经发布成功，CDN 会随后跟上，标红只会制造无意义的告警。
      - name: Verify the published URL
        id: verify
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsSL "https://cdn.jsdelivr.net/npm/@kangyishuai/dsh-plugin-index/index.json" -o /tmp/live.json; then
              node scripts/build-index.mjs --check --out /tmp/live.json
              node -e "
                const index = JSON.parse(require('node:fs').readFileSync('/tmp/live.json', 'utf8'));
                console.log('live index:', index.plugins.length, 'plugins');
                for (const plugin of index.plugins) console.log(' ', plugin.name, plugin.versions[0].version);
              "
              # 只"是合法索引"还不够：CDN 可能仍在发 12 小时的旧缓存。
              # 2026-11-22 实测到这种情况：npm 上已有 0.9.1，不带版本号的 URL 仍返回 0.9.0，
              # 而这一步因为"内容合法"直接过了——等于把"用户看不到新版本"判成成功。
              node -e "
                const fs = require('node:fs');
                const live = JSON.parse(fs.readFileSync('/tmp/live.json', 'utf8'));
                const built = JSON.parse(fs.readFileSync('build/index.json', 'utf8'));
                const latest = (index) => new Map(index.plugins.map((p) => [p.name, p.versions[0]?.version ?? '']));
                const liveMap = latest(live);
                const builtMap = latest(built);
                const stale = [...builtMap].filter(([name, version]) => liveMap.get(name) !== version);
                if (stale.length > 0) {
                  console.log('CDN 仍是旧内容，落后：' + stale.map(([n, v]) => n + '@' + v).join('、'));
                  process.exit(1);
                }
                console.log('CDN 内容与本次构建一致');
              "
              echo "cdn=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::jsDelivr 在 3 分钟内没有提供与本次构建一致的 index.json；npm 上已发布，CDN 会随后跟上"
          echo "cdn=lagging" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 插件索引源"
            echo
            echo '```'
            echo "https://cdn.jsdelivr.net/npm/@kangyishuai/dsh-plugin-index/index.json"
            echo '```'
            echo
            echo "在 **插件 → 发现 → 添加索引源** 里填这个地址。"
            echo
            echo "- 本次内容是否变化：\`${{ steps.diff.outputs.changed }}\`"
            echo "- CDN 验收：\`${{ steps.verify.outputs.cdn }}\`（空表示本次跳过）"
          } >> "$GITHUB_STEP_SUMMARY"
