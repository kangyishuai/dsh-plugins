name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 由 release.yml 调用：Version Packages PR 是 github-actions[bot] 用 GITHUB_TOKEN 开的，
  # 它产生的 pull_request 事件不会触发新工作流，所以那个 PR 上永远没有 CI 结果。
  # 分支保护要求 CI 绿才能合并，于是 release.yml 用 workflow_dispatch 在这个分支上补跑一次，
  # 让检查结果落到同一个 head commit 上。手动补跑也用这个入口：
  #   gh workflow run ci.yml --ref changeset-release/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.19 = package.json#engines 的下限；24 = 本地开发版本（.node-version）
        node: ["22.19", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci --error-on-warnings .
      - run: pnpm typecheck
      - run: pnpm check
      # 文档一致性（版本指针 / ADR 索引 / runtime 引用 / 链接锚点 / 兼容表版本）：
      # 以前只在 nightly 的 `pnpm verify` 里跑，PR 可以带着文档漂移合入（AUD-XCT-03）。
      - run: pnpm check:docs
      - run: pnpm check:public
      - run: pnpm test

  probe:
    name: runtime probe (DSH surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # runner 上没有 DSH 桌面版（没有 app.asar），旧写法会让探针打印 SKIP 后 exit 0——
      # 而这是分支保护的必需检查，于是它恒绿（AUD-XCT-02）。现在按 AGENTS.md 的目标运行时
      # 版本从 npm 装一份宿主面：npm 上的 @deepseek-ai/dsh 与桌面版是同一套包，
      # 探针用 --surface 显式指向它；装不出 / 版本不对都非零退出。
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dsh-surface
          key: dsh-surface-${{ runner.os }}-${{ hashFiles('AGENTS.md') }}
      - run: node scripts/prepare-dsh-surface.mjs --output "$RUNNER_TEMP/dsh-surface"
      - run: node scripts/probe-runtime.mjs --surface "$RUNNER_TEMP/dsh-surface/node_modules"
      # 门禁结构检查：每个插件都必须有 verify/probe/web 冒烟三个必需步骤。
      - run: pnpm gate session-rewind --dry-run
      - run: pnpm gate session-delete --dry-run
      - run: pnpm gate advisor --dry-run
      - run: pnpm gate artifacts --dry-run
      - run: pnpm gate projects --dry-run
      # 八个发布插件的批量门禁结构（verify/probe 只跑一次 + 每插件 web/桌面脚本齐全），纯离线。
      # AUD-XCT-04：旧清单只有六个，artifacts / projects 不在其中。
      - run: pnpm gate:all --dry-run

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
