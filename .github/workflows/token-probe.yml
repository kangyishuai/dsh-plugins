name: token probe

# 一次性探针（不合并）：验证 RELEASE_TOKEN 是否具备
#   1. Contents: write —— 用 PAT 通过 GitHub API 建一个分支 ref（changesets/action 也是走 API，不是 git push）
#   2. Pull requests: write —— 用 PAT 开一个 PR
#   3. PAT 创建的 PR 会不会触发 pull_request 工作流（这是整件事的关键）
# 只在本探针分支上跑，避免递归触发；验完自动关闭并删除它自己开的 PR 和分支。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'chore/repo-token-probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Probe RELEASE_TOKEN
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          BRANCH="probe/pat-pr"
          echo "PROBE_BRANCH=$BRANCH" >> "$GITHUB_ENV"

          echo "=== 1. 令牌自述权限 ==="
          gh api "repos/${REPO}" --jq '.permissions|tojson' || echo "读取失败"

          echo "=== 2. Contents: write —— 用 API 建分支 ref（与 changesets/action 同路径）==="
          if out=$(gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$SHA" 2>&1); then
            echo "建 ref 成功：$(echo "$out" | head -c 120)"
          else
            echo "::error::建 ref 失败：$out"
            exit 1
          fi

          echo "=== 3. Pull requests: write —— 用 PAT 开 PR ==="
          if url=$(gh pr create --head "$BRANCH" --base "$BASE" \
                     --title "chore(repo): PAT 探针 PR（会自动关闭）" \
                     --body "验证 RELEASE_TOKEN 能开 PR，以及它开的 PR 会触发 CI。验证完自动关闭。" 2>&1); then
            echo "已创建：$url"
            num=$(basename "$url")
            echo "$num" > /tmp/probe-pr
            echo "=== 4. 等 CI 出现（那个 PR 由 PAT 创建，应该触发 pull_request 工作流）==="
            for i in $(seq 1 12); do
              sleep 15
              total=$(gh pr checks "$num" --json name --jq 'length' 2>/dev/null || echo 0)
              echo "第 ${i} 次：检查数量 = ${total}"
              [ "${total:-0}" -gt 0 ] && break
            done
            gh pr checks "$num" 2>&1 | head -10 || true
            if [ "${total:-0}" -gt 0 ]; then
              echo "::notice::PAT 创建的 PR 触发了 ${total} 个检查 —— 机制成立"
            else
              echo "::warning::PAT 创建的 PR 没有检查 —— 机制不成立"
            fi
          else
            echo "::error::gh pr create 失败：$url"
            exit 1
          fi
      - name: Cleanup probe PR and branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          num="$(cat /tmp/probe-pr 2>/dev/null || true)"
          if [ -n "$num" ]; then gh pr close "$num" --delete-branch --comment "探针结束，自动清理。" || true; fi
          gh api -X DELETE "repos/${REPO}/git/refs/heads/probe/pat-pr" 2>/dev/null || true
          echo "清理完成"
