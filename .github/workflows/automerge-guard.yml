name: Automerge guard

# PR 带 `automerge` 标签时，校验改动面是否落在 CONTRIBUTING §自动合并分级 的白名单里：
# 不合规就摘标签 + 关闭已武装的 auto-merge + 留一条说明评论（判定逻辑见
# scripts/automerge-guard.mjs，规则见 docs/adr/0014-automerge-tiers.md）。
#
# 故意**不**由本工作流代劳「武装 auto-merge」：用 GITHUB_TOKEN 发起的合并不会触发
# push 工作流，会吞掉 Release（发版链）。武装仍然只由人或 agent 用 PAT 执行。
on:
  # pull_request_target 在本仓库自 2026-11-16 16:49Z 起整类启动失败（guard 与 labeler
  # 同时 startup_failure，CI 的 pull_request 正常）。这里改用 pull_request：同仓 PR 的
  # GITHUB_TOKEN 仍可写标签/评论，脚本行为不变，只是不再检出基分支执行。
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: automerge-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    if: github.repository == 'kangyishuai/dsh-plugins'
    runs-on: ubuntu-latest
    steps:
      # pull_request 下检出的是 PR 合并结果，但脚本只读标签与改动面，不执行 PR 里的代码。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: 校验 automerge 分级
        env:
          # 标签 / 评论 / 关闭 auto-merge 用仓库自带 token 就够。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 合规后由 guard 武装 auto-merge，必须用 PAT：GITHUB_TOKEN 发起的合并不会触发
          # push 工作流，会吞掉 Release（发版链）。没配 PAT 时 guard 只打印提示、不武装。
          AUTOMERGE_PAT: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/automerge-guard.mjs --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
